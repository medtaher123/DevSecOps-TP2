name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest -q

  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit - full report (non blocking)
        run: bandit -r app.py -f txt -o bandit-report.txt || true

      - name: Bandit - gate (fail on HIGH severity)
        run: bandit -r app.py -lll

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare folders
        run: mkdir -p reports .odc-data && chmod -R 777 reports .odc-data

      - name: Restore NVD cache
        uses: actions/cache/restore@v4
        with:
          path: .odc-data
          key: odc-data-${{ github.run_id }}
          restore-keys: |
            odc-data-

      - name: Dependency-Check (fail on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -v "$PWD/reports":/report \
            -v "$PWD/.odc-data":/usr/share/dependency-check/data \
            owasp/dependency-check \
            --scan /src/requirements.txt \
            --enableExperimental \
            --format HTML --format JSON \
            --out /report \
            --project vulnerable-notes \
            --failOnCVSS 7 \
            --nvdApiKey "$NVD_API_KEY"

      - name: Save NVD cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .odc-data
          key: odc-data-${{ github.run_id }}

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/